# This workflow demonstrates building a Docker image, pushing it to JFrog Artifactory,
# and attaching an SLSA build provenance attestation, which is stored in JFrog Evidence.

name: Build, Push, and Attest to JFrog

on:
  push:
    branches:
      - jfrog-evidence
  workflow_dispatch:

# Use GitHub variables (vars) and secrets (secrets) for configuration
env:
  JF_URL: ${{ vars.JF_URL }}
  JF_REPO: slash-maven-dev-local

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write      # Required for OIDC token access
      attestations: write  # Required for attestation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: soleng.jfrog.io
        with:
        #   oidc-provider-name: slash-github
        #   oidc-audience: slash-github-audience

          oidc-provider-name: slash-l/jpd-github@github

      - name: Run JFrog CLI
        run: |
          # Ping the server
          jf rt ping
          jf c show

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # 它会根据所有包含的 pom.xml 生成缓存 Key

      - name: Build maven Package
        id: build-maven
        working-directory: ./app-maven  # 设置工作目录
        run: |
          echo "当前目录: $(pwd)"

          jf mvnc --server-id-resolve=setup-jfrog-cli-server --server-id-deploy=setup-jfrog-cli-server --repo-resolve-releases=slash-maven-virtual --repo-resolve-snapshots=slash-maven-virtual --repo-deploy-releases=slash-maven-virtual --repo-deploy-snapshots=slash-maven-virtual

          jf mvn install --build-name=slash-jpd-github-maven --build-number=${{github.run_number}}
          jf rt bce slash-jpd-github-maven ${{github.run_number}}
          jf rt bp slash-jpd-github-maven ${{github.run_number}}

      - name: Build and Push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          file: app-maven/Dockerfile
          push: true
          tags: ${{ env.JF_URL }}/${{ env.JF_REPO }}/app-maven:${{ github.run_number }}

      - name: Attest Docker Image and Send to JFrog Evidence
        uses: actions/attest-build-provenance@v3
        with:
        # The 'oci://' prefix is required by JFrog to correctly parse the artifact type
          subject-name: oci://${{ env.JF_URL }}/${{ env.JF_URL }}/app-maven
        
        # This links the attestation directly to the image digest from the build step
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          

